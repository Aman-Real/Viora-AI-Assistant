name: viora
description: "Viora - real-time AI voice assistant built with Flutter and Gemini"
publish_to: 'none'

version: 2.0.0+2

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^5.1.0
  firebase_ai: ^5.1.0
  firebase_app_check: ^0.5.1
  provider: ^6.1.5+1
  shared_preferences: ^2.5.6
  record: ^7.1.2
  flutter_soloud: ^4.1.7
  image_picker: ^1.2.4
  flutter_local_notifications: ^23.0.0
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  url_launcher: ^6.3.3
  http: ^1.6.0
  intl: ^0.20.3
  flutter_markdown_plus: ^1.0.12
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/brand/logo_mark.png
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-400.ttf
          weight: 400
        - asset: assets/fonts/Inter-500.ttf
          weight: 500
        - asset: assets/fonts/Inter-600.ttf
          weight: 600
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-500.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk-700.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/brand/app_icon.png
  adaptive_icon_background: "#07070D"
  adaptive_icon_foreground: assets/brand/app_icon_fg.png
  min_sdk_android: 24
  web:
    generate: true
    image_path: assets/brand/app_icon.png
    background_color: "#07070D"
    theme_color: "#07070D"
