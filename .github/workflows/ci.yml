name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.2
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.2
          cache: true
      - run: flutter pub get
      # Builds run in demo mode: no Firebase secrets are needed in CI.
      - run: flutter build web --release --no-web-resources-cdn --dart-define=VIORA_DEMO=true
      - run: flutter build apk --release --dart-define=VIORA_DEMO=true
      - uses: actions/upload-artifact@v4
        with:
          name: viora-builds
          path: |
            build/web
            build/app/outputs/flutter-apk/app-release.apk
