<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Viora - a real-time AI voice assistant built with Flutter and Gemini Live.">
  <meta name="theme-color" content="#07070D">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Viora">
  <meta property="og:title" content="Viora - AI voice assistant">
  <meta property="og:description" content="Talk to Gemini in real time, ask about photos, set reminders. Built with Flutter.">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">
  <title>Viora - AI voice assistant</title>
  <style>
    html, body { background: #07070D; margin: 0; height: 100%; }
    #splash { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
    #splash div { width: 96px; height: 96px; border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #fff 0, #a99bff 22%, #7b61ff 60%, #1e1660 100%);
      box-shadow: 0 0 60px #7b61ff88; animation: pulse 1.6s ease-in-out infinite; }
    @keyframes pulse { 50% { transform: scale(1.08); } }
    @media (prefers-reduced-motion: reduce) { #splash div { animation: none; } }
  </style>
</head>
<body>
  <div id="splash" aria-hidden="true"><div></div></div>
  <script>
    window.addEventListener('flutter-first-frame', () => document.getElementById('splash')?.remove());
  </script>
  <script src="flutter_bootstrap.js" async></script>
  <!-- flutter_soloud (audio playback for live voice) -->
  <script src="assets/packages/flutter_soloud/web/libflutter_soloud_plugin.js" defer></script>
  <script src="assets/packages/flutter_soloud/web/init_module.dart.js" defer></script>
</body>
</html>
